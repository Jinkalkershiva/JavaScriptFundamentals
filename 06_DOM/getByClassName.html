<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Notes</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:40px;
    text-align:center;
}

.section{
    margin:30px 0;
}

button{
    padding:10px 18px;
    margin:10px;
    border:none;
    background:#3498db;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#2980b9;
}

.box{
    width:220px;
    height:120px;
    background:#87ceeb;
    margin:auto;
    line-height:120px;
    font-weight:bold;
    border-radius:6px;
}

input{
    padding:10px;
    width:220px;
}

ul{
    list-style:none;
    padding:0;
}

.item{
    background:white;
    margin:8px auto;
    width:220px;
    padding:10px;
    border-radius:4px;
    cursor:pointer;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
}

.card{
    width:120px;
    height:100px;
    background:white;
    line-height:100px;
    border-radius:6px;
    box-shadow:0 0 6px rgba(0,0,0,0.2);
    cursor:pointer;
}

img{
    width:150px;
    border-radius:5px;
    cursor:pointer;
}

</style>

</head>

<body>

<h1 id="title">JavaScript Event Handling Practice</h1>

<div class="section">
<button id="clickBtn">Click Me</button>
<button id="dblBtn">Double Click</button>
<button class="toggleBtn">Toggle Something</button>
</div>

<div class="section">
<div class="box">Hover Area</div>
</div>

<div class="section">
<input type="text" id="inputBox" placeholder="Type here...">
</div>

<div class="section">
<ul>
<li class="item">List Item 1</li>
<li class="item">List Item 2</li>
<li class="item">List Item 3</li>
<li class="item">List Item 4</li>
</ul>
</div>

<div class="section">
<img class="image" src="https://via.placeholder.com/150">
</div>

<div class="section cards">
<div class="card">Card 1</div>
<div class="card">Card 2</div>
<div class="card">Card 3</div>
</div>

</body>
</html>
